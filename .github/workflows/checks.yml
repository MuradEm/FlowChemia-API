name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowchemia
          POSTGRES_PASSWORD: flowchemia_local
          POSTGRES_DB: flowchemia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowchemia -d flowchemia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: npm run test:simulation
