services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: flowchemia
      POSTGRES_PASSWORD: flowchemia_local
      POSTGRES_DB: flowchemia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowchemia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowchemia -d flowchemia"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  flowchemia-db:
